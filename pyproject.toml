[project]
name = "painel-macroeconomico-bcb"
version = "1.0.0"
description = "Sistema de análise de dados e dashboard interativo com dados abertos do Banco Central do Brasil"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP037", "B905"]

[tool.ruff.lint.per-file-ignores]
# As células do notebook ficam em textos longos dentro do script.
"scripts/gerar_notebook.py" = ["E501"]
