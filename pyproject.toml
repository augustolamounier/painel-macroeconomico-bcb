[project]
name = "painel-macroeconomico-bcb"
version = "1.0.0"
description = "Sistema de análise de dados e dashboard interativo com dados abertos do Banco Central do Brasil"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP037", "B905"]
