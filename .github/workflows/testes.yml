name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      PAINEL_FONTE: csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Verificar estilo (ruff)
        run: ruff check .
      - name: Executar testes
        run: pytest --cov=painel_macro --cov-report=term-missing
